name = "stremio-gdrive-addon-cat"
main = "src/index.js"
compatibility_date = "2024-12-02"
workers_dev = true
preview_urls = true
compatibility_flags = [ "nodejs_compat" ]
[observability.logs]
enabled = true

# Mapa persistent de caràtules (títol → TMDB/IMDb). Sense aquest vincle el
# worker cau a la Cache API, que és per centre de dades i volàtil: el cron
# escrivia en un centre, les peticions d'Espanya en llegien un altre, i el
# mapa es quedava en una dotzena d'entrades.
# Sense "id": wrangler (>= 3.91) el crea sol al primer "wrangler deploy" i
# el reutilitza als següents.
[[kv_namespaces]]
binding = "MAPA_KV"

# Cron Trigger: una passada d'/omplir cada minut. Cada invocació té 50
# subpeticions al pla gratuït (~10 títols): el mapa complet (noms, IMDb,
# sinopsis) s'omple en una o dues hores. Mentrestant les caràtules ja surten
# bé gràcies a /poster a demanda. Quan està ple, cada passada no fa res.
[triggers]
crons = ["* * * * *"]
